name: Release POS Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "pos-v*"

permissions:
  contents: write

jobs:
  build-windows-installer:
    name: Build .exe (electron-builder, NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias (pos-desktop + shared)
        run: npm install --workspace=apps/pos-desktop --workspace=packages/shared --no-audit --no-fund

      - name: Compilar renderer + proceso principal
        run: npm run build --workspace=apps/pos-desktop

      - name: Empaquetar .exe y publicar como GitHub Release
        run: npx electron-builder --win nsis --publish always
        working-directory: apps/pos-desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
