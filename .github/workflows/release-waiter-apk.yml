name: Release Waiter APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build .apk (expo prebuild + gradle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Instalar dependencias (waiter-mobile + shared)
        run: npm install --workspace=apps/waiter-mobile --workspace=packages/shared --no-audit --no-fund

      # Auto-incrementa versión (patch) y versionCode en cada corrida — así cada .apk que se
      # publica en GitHub Releases lleva un número distinto SIEMPRE, sin depender de que alguien
      # se acuerde de editar app.json/package.json a mano antes de disparar el workflow. Antes de
      # esto quedó publicado un v0.1.0 roto (build debug, sin JS embebido) junto a un v0.1.1 bueno
      # y no había forma de saber cuál bajar con solo mirar el nombre — con el bump automático
      # cada release nuevo es, por construcción, más alto que el anterior.
      - name: Auto-incrementar versión (patch + versionCode)
        id: version
        working-directory: apps/waiter-mobile
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            const partes = pkg.version.split('.').map(Number);
            const nueva = partes[0] + '.' + partes[1] + '.' + (partes[2] + 1);
            pkg.version = nueva;
            app.expo.version = nueva;
            app.expo.android.versionCode = (app.expo.android.versionCode || 1) + 1;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + nueva + '\n');
          "

      - name: Confirmar el bump de versión en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/waiter-mobile/package.json apps/waiter-mobile/app.json
          git commit -m "chore(waiter-mobile): bump versión a ${{ steps.version.outputs.version }} [skip ci]"
          git push origin HEAD:main

      - name: Generar el proyecto nativo de Android (expo prebuild)
        working-directory: apps/waiter-mobile
        run: npx expo prebuild --platform android --non-interactive

      # IMPORTANTE: "release" (no "debug"). Un APK debug de Expo/RN nunca empaqueta el JS —
      # siempre intenta conectarse al Metro bundler de una máquina de desarrollo (localhost:8081),
      # así que en cualquier dispositivo real muestra "Unable to load script"/"Could not connect
      # to development server". El build type "release" del template de Expo/RN sí empaqueta el
      # JS embebido (tarea `createBundleReleaseJsAndAssets`) y todos los módulos nativos usados
      # (async-storage, expo-file-system, etc.) quedan compilados dentro del .apk — es un
      # standalone instalable sin depender de ninguna máquina ni de instalar nada aparte, firmado
      # por defecto con la keystore de depuración de Gradle (ver signingConfig en
      # android/app/build.gradle, generado por el prebuild).
      - name: Compilar el .apk (release standalone, JS + módulos nativos embebidos)
        working-directory: apps/waiter-mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Renombrar el .apk con la versión
        working-directory: apps/waiter-mobile/android/app/build/outputs/apk/release
        run: mv app-release.apk HANGAR-421-Meseros-${{ steps.version.outputs.version }}.apk

      - name: Publicar como GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: waiter-v${{ steps.version.outputs.version }}
          name: HANGAR 421 Meseros v${{ steps.version.outputs.version }}
          body: |
            APK de la app de meseros HANGAR 421 (compilado automáticamente vía GitHub Actions —
            `expo prebuild` + Gradle, build **release** standalone: JS y módulos nativos
            embebidos, no necesita ninguna máquina de desarrollo corriendo ni instalar nada
            aparte, listo para distribución interna e instalación directa en tablets/celulares
            Android).

            Firmado con la keystore de depuración de Gradle (válido para instalación directa
            fuera de Play Store). Para publicar en Play Store, firmar con una keystore propia
            — ver `docs/installation.md` §9.
          files: apps/waiter-mobile/android/app/build/outputs/apk/release/HANGAR-421-Meseros-${{ steps.version.outputs.version }}.apk
          draft: false
